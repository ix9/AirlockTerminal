name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/release.yml', 'build/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Only a v* tag build on macOS signs and notarizes. Everything else, PRs included, builds
      # unsigned, and never sees the signing secrets.
      SIGN_MAC: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No secrets here: install scripts from npm packages run in this step.
      - run: npm ci

      # The notarization key has to be a file. It lives in the runner's temp folder, which is
      # wiped when the job ends, and is deleted at the end of the job anyway.
      - name: Write the notarization key
        if: env.SIGN_MAC == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Tags publish to a draft release; other runs just check that the build works.
      - name: Build
        shell: bash
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (electron-builder takes the .p12 as base64 in CSC_LINK) and notarization.
          CSC_LINK: ${{ env.SIGN_MAC == 'true' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ env.SIGN_MAC == 'true' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY: ${{ env.SIGN_MAC == 'true' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_API_ISSUER || '' }}
          # Unsigned builds must not go looking for a certificate on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.SIGN_MAC == 'true' && 'true' || 'false' }}

      # electron-builder notarizes and staples the app inside the DMG, which is what Gatekeeper checks.
      - name: Check the signature and notarization
        if: env.SIGN_MAC == 'true'
        shell: bash
        run: |
          app="$(find dist -maxdepth 2 -name '*.app' -type d | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Remove the notarization key
        if: always() && env.SIGN_MAC == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
