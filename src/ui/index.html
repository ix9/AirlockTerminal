<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Airlock Terminal</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="titlebar">
    <span class="app-name">Airlock Terminal</span>
    <span class="spacer"></span>
    <span id="usage"></span>
  </header>
  <main id="app">
    <section id="left">
      <header id="toolbar">
        <select id="shell" title="Shell"></select>
        <button id="restart" title="Restart the shell">Restart</button>
      </header>
      <div id="envbar" hidden></div>
      <div id="terminal"></div>
      <div id="hsplit" class="splitter"></div>
      <div id="airlock">
        <header>
          <span class="section-title">Airlock</span>
          <button id="paste">Paste</button>
          <button id="clear">Clear</button>
          <button id="run" class="primary" title="Send to terminal (Ctrl+Enter)">Run ⏎</button>
        </header>
        <textarea id="airlock-text" spellcheck="false"
                  placeholder="Copy a command in the chat and it lands here. Ctrl+Enter runs it."></textarea>
      </div>
    </section>
    <div id="vsplit" class="splitter"></div>
    <section id="chat"></section>
  </main>
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
