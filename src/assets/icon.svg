<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- An airlock hatch: hazard ring, steel frame, sealed door and locking wheel.
       The tile is inset so it matches the size of other macOS icons. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3042"/><stop offset="1" stop-color="#0b1520"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3ced8"/><stop offset="1" stop-color="#55636f"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d4f5e"/><stop offset="1" stop-color="#1c2732"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aebbc6"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g transform="translate(512 512)">
    <circle r="358" fill="none" stroke="#f7b500" stroke-width="56"/>
    <circle r="358" fill="none" stroke="#10181f" stroke-width="56" stroke-dasharray="46.86 46.86"/>
    <circle r="322" fill="url(#frame)"/>
    <circle r="252" fill="url(#door)" stroke="#10181f" stroke-width="10"/>
    <g fill="#10181f">
      <circle cx="0" cy="-287" r="14"/><circle cx="203" cy="-203" r="14"/>
      <circle cx="287" cy="0" r="14"/><circle cx="203" cy="203" r="14"/>
      <circle cx="0" cy="287" r="14"/><circle cx="-203" cy="203" r="14"/>
      <circle cx="-287" cy="0" r="14"/><circle cx="-203" cy="-203" r="14"/>
    </g>
    <g transform="rotate(45)" stroke="url(#wheel)" stroke-linecap="round" fill="none">
      <circle r="150" stroke-width="44"/>
      <path d="M0-150V150M-150 0H150" stroke-width="38"/>
    </g>
    <circle r="56" fill="#29b6f6" stroke="#10181f" stroke-width="10"/>
  </g>
</svg>
